[project]
name = "homeassistant-apple-music"
version = "0.1.0"
description = "Search Apple Music and play it on Sonos speakers from Home Assistant."
license = "MIT"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "codespell==2.4.3",
  "gazetteer-matcher==1.1.0",
  "hassil==3.12.1",
  "home-assistant-intents==2026.10.6",
  "mypy==2.4.0",
  "pylint==4.1.2",
  "pytest-homeassistant-custom-component==0.13.370",
  "ruff==0.16.10",
  "yamllint==1.38.0",
]

[tool.uv]
# This repository is a Home Assistant integration, not a Python package.
package = false

[tool.mypy]
platform = "linux"
python_version = "3.14"
show_column_numbers = true
follow_imports = "normal"
ignore_missing_imports = true
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true
strict_optional = true
warn_incomplete_stub = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
explicit_package_bases = true

[[tool.mypy.overrides]]
# Home Assistant re-exports names without __all__.
module = "homeassistant.*"
implicit_reexport = true

[tool.pylint.BASIC]
good-names = ["_", "ex", "fp", "i", "id", "j", "k", "on", "Run", "T", "CONFIG_SCHEMA"]

[tool.pylint."MESSAGES CONTROL"]
disable = [
  "abstract-method",
  # pytest fixtures are passed in by name.
  "redefined-outer-name",
  "too-few-public-methods",
  "too-many-positional-arguments",
  "duplicate-code",
  "format",
  "unsubscriptable-object",
]

[tool.pylint.FORMAT]
max-line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
lint.select = ["ALL"]
lint.ignore = [
  "ANN401",  # Opinioated warning on disallowing dynamically typed expressions
  "CPY001",  # No copyright headers, the LICENSE file covers the project
  "D203",    # Conflicts with other rules
  "D213",    # Conflicts with other rules
  "D417",    # False positives in some occasions
  "PLR2004", # Just annoying, not really useful
  "SLOT000", # Has a bug with enums: https://github.com/astral-sh/ruff/issues/5748

  # Conflicts with the Ruff formatter
  "COM812",
  "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "S105", "S106", "SLF001"]

[tool.ruff.lint.flake8-pytest-style]
mark-parentheses = false
fixture-parentheses = false

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.codespell]
ignore-words = ".codespell-ignore"
# Dutch translations and recorded catalog responses are not English.
skip = "*/translations/nl.json,*/fixtures/*.json"
